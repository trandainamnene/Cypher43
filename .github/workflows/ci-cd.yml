name: Backend CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # Job 1: Test & Build
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests (if available)
      run: npm test || echo "No tests configured"
      continue-on-error: true
      
    - name: Check code syntax
      run: node -c index.js
      
    - name: Build success notification
      run: echo "✅ Backend build successful!"

  # Job 2: Docker Build (Optional)
  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Create Dockerfile if not exists
      run: |
        if [ ! -f Dockerfile ]; then
          cat > Dockerfile << 'EOF'
        FROM node:20-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci --only=production
        COPY . .
        EXPOSE 3000
        CMD ["npm", "start"]
        EOF
        fi
        
    - name: Build Docker image
      run: docker build -t cypher43-backend:latest .
      
    - name: Docker build success
      run: echo "🐳 Docker image built successfully!"

  # Job 3: Deploy notification
  deploy-ready:
    runs-on: ubuntu-latest
    needs: [test-and-build, docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Deployment ready
      run: |
        echo "🚀 Backend is ready for deployment!"
        echo "📦 You can deploy to:"
        echo "   - Railway: https://railway.app"
        echo "   - Render: https://render.com"
        echo "   - Heroku: https://heroku.com"
        echo "   - DigitalOcean App Platform"
